name: Crea APK Canzoni Coro V21

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai il progetto V21
        run: |
          unzip -o CanzoniCoro_V21_SalvataggioSicuro_Offline.zip
          sed -i "s/versionCode 20/versionCode 21/; s/versionName '1.0.20'/versionName '1.0.21'/" android/app/build.gradle
          sed -i 's/@drawable\/canzoni_coro_icon/@drawable\/ic_launcher/g' android/app/src/main/AndroidManifest.xml

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK V21
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Pubblica APK V21
        uses: actions/upload-artifact@v4
        with:
          name: Canzoni-Coro-V21-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
